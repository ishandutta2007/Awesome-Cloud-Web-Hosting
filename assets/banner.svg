<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      letter-spacing: -1px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .metric-val {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 700;
      font-size: 18px;
      fill: #38bdf8;
    }
    .metric-lbl {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 500;
      font-size: 12px;
      fill: #64748b;
    }

    /* Ambient Dynamic Pulsing */
    @keyframes orbPulse {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(20px, -15px); opacity: 0.6; }
    }
    @keyframes orbPulseRev {
      0%, 100% { transform: scale(1.1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(0.9) translate(-25px, 20px); opacity: 0.55; }
    }
    @keyframes dashTravel {
      to { stroke-dashoffset: -100; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .orb-1 { animation: orbPulse 8s ease-in-out infinite; transform-origin: center; }
    .orb-2 { animation: orbPulseRev 10s ease-in-out infinite; transform-origin: center; }
    .flow-stream { stroke-dasharray: 8, 8; animation: dashTravel 4s linear infinite; }
    .card-float { animation: floatCard 6s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Animated Glowing Background Orbs (Behind content) -->
  <g opacity="0.4">
    <circle class="orb-1" cx="200" cy="80" r="140" fill="#0284c7" filter="url(#glowCyan)" />
    <circle class="orb-2" cx="1050" cy="300" r="180" fill="#7c3aed" filter="url(#glowPurple)" />
    <circle class="orb-1" cx="900" cy="90" r="100" fill="#06b6d4" filter="url(#glowCyan)" />
  </g>

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Dynamic Network Connection Streams in Background -->
  <g opacity="0.35">
    <path class="flow-stream" d="M 50 340 C 300 340, 400 200, 750 200 S 1000 350, 1150 350" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-stream" d="M 50 80 C 350 80, 500 220, 850 220 S 1050 80, 1150 80" fill="none" stroke="#818cf8" stroke-width="1.5" />
  </g>

  <!-- Foreground Content Area -->

  <!-- Top Badges / Category Indicators -->
  <g transform="translate(80, 60)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="16" cy="16" r="4" fill="#38bdf8" />
    <text x="30" y="21" class="pill-text">CLOUD PAAS</text>

    <!-- Pill 2 -->
    <rect x="142" y="0" width="156" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="158" cy="16" r="4" fill="#818cf8" />
    <text x="172" y="21" class="pill-text">CONTROL PANELS</text>

    <!-- Pill 3 -->
    <rect x="310" y="0" width="144" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="326" cy="16" r="4" fill="#c084fc" />
    <text x="340" y="21" class="pill-text">SELF-HOSTED</text>
  </g>

  <!-- Main Foreground Title & Subtitle (High Contrast, Clear Z-Index) -->
  <g transform="translate(80, 150)">
    <!-- Text Glow Shadow for extreme readability -->
    <text x="0" y="0" class="title-text" fill="url(#primaryGrad)">Awesome Cloud Web Hosting</text>
    <text x="0" y="44" class="subtitle-text">Curated Production SaaS Platforms, Self-Hosted PaaS &amp; Open Control Panels</text>
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14px" fill="#64748b" font-weight="500">
      ⚡ Comprehensive Directory • Pricing Intelligence • Deployment Workflows • Open Architecture
    </text>
  </g>

  <!-- Side Floating Interactive Metric Cards (Anchored right side) -->
  <g class="card-float" transform="translate(840, 110)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="280" height="74" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="35" cy="37" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 27 37 L 33 43 L 43 31" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <text x="68" y="34" class="metric-val">100% Tested</text>
    <text x="68" y="54" class="metric-lbl">Enterprise SaaS &amp; Open-Source</text>

    <!-- Card 2 -->
    <g transform="translate(0, 92)">
      <rect x="0" y="0" width="280" height="74" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="35" cy="37" r="18" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" />
      <!-- Star icon -->
      <polygon points="35,27 38,34 45,35 40,40 41,47 35,43 29,47 30,40 25,35 32,34" fill="#fbbf24" />
      <text x="68" y="34" class="metric-val">140K+ Stars</text>
      <text x="68" y="54" class="metric-lbl">Combined Open Source Power</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="396" width="1200" height="4" fill="url(#primaryGrad)" />
</svg>
